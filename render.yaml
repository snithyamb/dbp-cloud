services:
  - type: web
    name: dbp-cloud-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: VCU_TOKEN
        sync: false
      - key: TIER3_KEY
        sync: false
